name: Branch policy

on:
  pull_request:
    branches: [main]

jobs:
  only-develop-to-main:
    runs-on: ubuntu-latest
    steps:
      - name: Require head branch develop
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "PRs to main must come from develop (got '${{ github.head_ref }}')."
            exit 1
          fi
