<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1200" height="820" fill="#F8FAFC"/>
  <text x="600" y="50" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">Arquitectura Miaucraft</text>
  <text x="600" y="78" text-anchor="middle" font-size="15" fill="#475569">LoopDev como cerebro · Shopify para venta directa · Amazon como canal</text>

  <rect x="60" y="120" width="260" height="110" rx="14" fill="#E2E8F0" stroke="#94A3B8"/>
  <text x="190" y="158" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Clientes</text>
  <text x="190" y="184" text-anchor="middle" font-size="14" fill="#334155">Web pública y Amazon</text>

  <rect x="60" y="300" width="260" height="150" rx="14" fill="#005F73"/>
  <text x="190" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">Web pública</text>
  <text x="190" y="366" text-anchor="middle" font-size="14" fill="#E0F2F1">miaucraft.com</text>
  <text x="190" y="390" text-anchor="middle" font-size="13" fill="#E0F2F1">React + Vite (headless)</text>
  <text x="190" y="412" text-anchor="middle" font-size="13" fill="#E0F2F1">Lee catálogo de Shopify</text>

  <rect x="470" y="300" width="260" height="150" rx="14" fill="#95BF47"/>
  <text x="600" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Shopify</text>
  <text x="600" y="366" text-anchor="middle" font-size="14" fill="#1E293B">Checkout y pagos</text>
  <text x="600" y="390" text-anchor="middle" font-size="13" fill="#1E293B">Pedidos DTC</text>
  <text x="600" y="412" text-anchor="middle" font-size="13" fill="#1E293B">Storefront API (pública)</text>

  <rect x="470" y="540" width="260" height="170" rx="14" fill="#0A3D62"/>
  <text x="600" y="580" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">LoopDev</text>
  <text x="600" y="606" text-anchor="middle" font-size="14" fill="#DBEAFE">Fuente de verdad</text>
  <text x="600" y="630" text-anchor="middle" font-size="13" fill="#DBEAFE">Catálogo maestro (PIM)</text>
  <text x="600" y="652" text-anchor="middle" font-size="13" fill="#DBEAFE">Stock maestro · CRM</text>
  <text x="600" y="674" text-anchor="middle" font-size="13" fill="#DBEAFE">Campañas · Analítica</text>
  <text x="600" y="696" text-anchor="middle" font-size="13" fill="#DBEAFE">Supabase edge functions</text>

  <rect x="880" y="300" width="260" height="150" rx="14" fill="#FF9900"/>
  <text x="1010" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Amazon</text>
  <text x="1010" y="366" text-anchor="middle" font-size="14" fill="#1E293B">Marketplace</text>
  <text x="1010" y="390" text-anchor="middle" font-size="13" fill="#1E293B">SP-API (listings, pedidos)</text>
  <text x="1010" y="412" text-anchor="middle" font-size="13" fill="#1E293B">Amazon Ads (campañas)</text>

  <rect x="880" y="540" width="260" height="110" rx="14" fill="#E2E8F0" stroke="#94A3B8"/>
  <text x="1010" y="578" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Equipo interno</text>
  <text x="1010" y="604" text-anchor="middle" font-size="14" fill="#334155">Administra desde LoopDev</text>

  <line x1="190" y1="230" x2="190" y2="298" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="200" y="268" font-size="12" fill="#475569">navega</text>

  <line x1="320" y1="375" x2="468" y2="375" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="365" font-size="12" fill="#475569">catálogo / checkout</text>

  <line x1="600" y1="452" x2="600" y2="538" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="610" y="500" font-size="12" fill="#475569">webhooks: pedidos</text>

  <line x1="540" y1="538" x2="540" y2="452" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="530" y="500" text-anchor="end" font-size="12" fill="#475569">Admin API: productos y stock</text>

  <line x1="730" y1="600" x2="878" y2="420" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="790" y="500" font-size="12" fill="#475569">SP-API y Ads</text>

  <line x1="880" y1="595" x2="732" y2="595" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="730" width="1080" height="60" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="600" y="756" text-anchor="middle" font-size="13" fill="#334155">Regla: el stock y el catálogo maestro viven en LoopDev. Shopify y Amazon reciben copias sincronizadas.</text>
  <text x="600" y="776" text-anchor="middle" font-size="13" fill="#334155">Las credenciales de Shopify Admin y de Amazon solo se usan en servidor (edge functions).</text>
</svg>
